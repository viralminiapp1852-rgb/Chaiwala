<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chaiwala Hub - Viral Videos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag In-App Interstitial / Video Ad Script -->
  <script src="//kulroakonsu.net/88/tag.min.js" data-zone="YOUR_MONETAG_ZONE_ID" async data-cfasync="false"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0a0c10;
      --card: #141820;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #ff007a;
      --accent-grad: linear-gradient(135deg, #ff007a 0%, #7928ca 100%);
      --text: #f0f6fc;
      --muted: #8b949e;
      --success: #20c997;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 70px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .brand {
      font-size: 1.3rem;
      font-weight: 800;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .video-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .video-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .thumb-wrap {
      position: relative;
      width: 100%;
      height: 200px;
      background: #000;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      border: 2px solid rgba(255, 255, 255, 0.4);
    }

    .card-info {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .lock-tag {
      font-size: 0.75rem;
      font-weight: 700;
      color: #ffc107;
      background: rgba(255, 193, 7, 0.12);
      padding: 4px 8px;
      border-radius: 6px;
    }

    /* Task & Unlock Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .modal-desc {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .task-step {
      font-size: 1rem;
      font-weight: 800;
      color: var(--accent);
      background: rgba(255, 0, 122, 0.1);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 18px;
      border: 1px dashed var(--accent);
    }

    .btn-ad {
      width: 100%;
      background: var(--accent-grad);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .btn-download {
      display: none;
      width: 100%;
      background: var(--success);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 1rem;
      text-decoration: none;
      text-align: center;
      margin-top: 10px;
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">⚡ Chaiwala Hub</div>
  </header>

  <div class="video-grid" id="videoContainer">
    <div style="text-align:center; padding: 40px; color: var(--muted);">Loading videos...</div>
  </div>

  <!-- Download Unlock Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal-box">
      <h3 class="modal-title" id="mVideoTitle">Viral Video</h3>
      <p class="modal-desc">Complete 5 Video Ads to Unlock Direct Mediafire Link</p>
      
      <div class="task-step" id="taskCounterText">Ads Watched: 0 / 5</div>
      
      <button class="btn-ad" id="watchAdBtn" onclick="watchMonetagAd()">🎬 Watch Ad to Unlock</button>
      
      <a href="#" target="_blank" class="btn-download" id="downloadBtn">📥 Download Full Video (Mediafire)</a>
      
      <div>
        <button class="btn-close" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Firebase Config (Chaiwala Project)
    const firebaseConfig = {
      apiKey: "AIzaSyBNSpp5jQFiBLCR1f767zZVucZzVzi4kCA",
      authDomain: "chaiwala-40576.firebaseapp.com",
      databaseURL: "https://chaiwala-40576-default-rtdb.firebaseio.com",
      projectId: "chaiwala-40576",
      storageBucket: "chaiwala-40576.firebasestorage.app",
      messagingSenderId: "85697817373",
      appId: "1:85697817373:web:c8e123eaef5435649c0ff4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const videoContainer = document.getElementById("videoContainer");
    const taskModal = document.getElementById("taskModal");
    const mVideoTitle = document.getElementById("mVideoTitle");
    const taskCounterText = document.getElementById("taskCounterText");
    const watchAdBtn = document.getElementById("watchAdBtn");
    const downloadBtn = document.getElementById("downloadBtn");

    let activeVideo = null;
    let adsCount = 0;
    const REQUIRED_ADS = 5;

    // Load Videos Realtime
    db.ref("videos").on("value", (snapshot) => {
      const data = snapshot.val();
      videoContainer.innerHTML = "";

      if (!data) {
        videoContainer.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--muted);">Abhi koi video uplod nahi hai.</div>`;
        return;
      }

      Object.entries(data).reverse().forEach(([id, vid]) => {
        const card = document.createElement("div");
        card.className = "video-card";
        card.onclick = () => openTaskModal(vid);

        const thumb = vid.thumbnailUrl || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600';
        
        card.innerHTML = `
          <div class="thumb-wrap">
            <img src="${thumb}" onerror="this.src='https://via.placeholder.com/600x300?text=Viral+Video'" />
            <div class="play-badge">▶</div>
          </div>
          <div class="card-info">
            <div class="card-title">${vid.title}</div>
            <div class="lock-tag">🔒 5 Ads Task</div>
          </div>
        `;
        videoContainer.appendChild(card);
      });
    });

    function openTaskModal(vid) {
      activeVideo = vid;
      adsCount = 0;
      mVideoTitle.innerText = vid.title;
      updateTaskUI();
      downloadBtn.style.display = "none";
      watchAdBtn.style.display = "block";
      taskModal.style.display = "flex";
    }

    function closeModal() {
      taskModal.style.display = "none";
      activeVideo = null;
    }

    function updateTaskUI() {
      taskCounterText.innerText = `Ads Watched: ${adsCount} / ${REQUIRED_ADS}`;
    }

    // Monetag Ad Trigger
    function watchMonetagAd() {
      watchAdBtn.disabled = true;
      watchAdBtn.innerText = "Loading Ad...";

      // Trigger Monetag Ad Tag
      if (typeof show_88 === 'function') {
        show_88().then(() => {
          onAdSuccess();
        }).catch((e) => {
          onAdSuccess(); // Agar fail ya ad-block ho tab bhi count aage badhaye
        });
      } else {
        // Fallback agar direct link ya script trigger ho
        setTimeout(() => {
          onAdSuccess();
        }, 1500);
      }
    }

    function onAdSuccess() {
      adsCount++;
      updateTaskUI();
      watchAdBtn.disabled = false;
      watchAdBtn.innerText = "🎬 Watch Ad to Unlock";

      if (adsCount >= REQUIRED_ADS) {
        watchAdBtn.style.display = "none";
        taskCounterText.innerText = "🎉 All 5 Ads Completed! Link Unlocked!";
        taskCounterText.style.color = "var(--success)";
        taskCounterText.style.borderColor = "var(--success)";
        downloadBtn.href = activeVideo.videoUrl;
        downloadBtn.style.display = "block";
      }
    }
  </script>
</body>
</html>
