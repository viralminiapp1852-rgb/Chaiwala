<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chaiwala Hub - Viral Videos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Official Monetag Telegram Mini App SDK Tag -->
  <script src='//libtl.com/sdk.js' data-zone='11895299' data-sdk='show_11895299'></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #090b10;
      --card: #131722;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #ff0055;
      --accent-grad: linear-gradient(135deg, #ff0055 0%, #7928ca 100%);
      --text: #f0f6fc;
      --muted: #8b949e;
      --success: #00d26a;
      --warning: #ffb703;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 14px;
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 70px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0 16px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .status-tag {
      font-size: 0.72rem;
      font-weight: 700;
      background: rgba(0, 210, 106, 0.12);
      color: var(--success);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(0, 210, 106, 0.2);
    }

    .video-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .video-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: transform 0.15s ease;
      position: relative;
    }

    .video-card:active {
      transform: scale(0.985);
    }

    .thumb-wrap {
      position: relative;
      width: 100%;
      height: 195px;
      background: #000;
      overflow: hidden;
      cursor: pointer;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Views Badge (Top Left Corner) */
    .badge-views {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      gap: 4px;
      z-index: 2;
    }

    /* Lock Badge (Top Right Corner) */
    .badge-lock {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      color: var(--warning);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 183, 3, 0.3);
      display: flex;
      align-items: center;
      gap: 4px;
      z-index: 2;
    }

    .play-btn-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-title {
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.4;
      color: #fff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 2.8em;
    }

    .btn-card-action {
      width: 100%;
      background: var(--accent-grad);
      color: #fff;
      border: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.86rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(255, 0, 85, 0.25);
    }

    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(4, 5, 8, 0.88);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-box {
      background: #141822;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 22px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header-tag {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
    }

    .modal-subtitle {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .task-progress-box {
      background: #0c0e14;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 20px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .steps-dots {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 8px;
    }

    .step-pill {
      flex: 1;
      height: 6px;
      border-radius: 4px;
      background: #212634;
      transition: background 0.3s;
    }

    .step-pill.active {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .btn-watch {
      width: 100%;
      background: var(--accent-grad);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(255, 0, 85, 0.35);
    }

    .btn-download-unlocked {
      display: none;
      width: 100%;
      background: var(--success);
      color: #061e0e;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      text-decoration: none;
      text-align: center;
      margin-top: 4px;
      box-shadow: 0 6px 18px rgba(0, 210, 106, 0.35);
      cursor: pointer;
    }

    .btn-close-modal {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      margin-top: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">⚡ CHAIWALA HUB</div>
    <div class="status-tag">Live Feed</div>
  </header>

  <div class="video-grid" id="videoContainer">
    <div style="text-align:center; padding: 50px 20px; color: var(--muted); font-size: 0.85rem;">
      Syncing media database...
    </div>
  </div>

  <div class="modal-overlay" id="taskModal">
    <div class="modal-box">
      <div class="modal-header-tag">Video Unlock Task</div>
      <div class="modal-title" id="mVideoTitle">Mediafire Video</div>
      <div class="modal-subtitle">Direct download link unlock karne ke liye 5 video ads poore dekhein</div>

      <div class="task-progress-box">
        <div class="progress-info">
          <span style="color: var(--muted);" id="taskCounterText">Task Progress</span>
          <span style="color: var(--accent);" id="taskPercentText">0%</span>
        </div>
        <div class="steps-dots" id="stepsDotsContainer">
          <div class="step-pill" id="step-1"></div>
          <div class="step-pill" id="step-2"></div>
          <div class="step-pill" id="step-3"></div>
          <div class="step-pill" id="step-4"></div>
          <div class="step-pill" id="step-5"></div>
        </div>
      </div>

      <button class="btn-watch" id="watchAdBtn" onclick="watchMonetagAd()">
        ▶ Watch Video Ad (1/5)
      </button>

      <a href="#" target="_blank" class="btn-download-unlocked" id="downloadBtn" onclick="onDownloadClicked()">
        📥 Download on Mediafire
      </a>

      <div>
        <button class="btn-close-modal" onclick="closeModal()">Cancel & Close</button>
      </div>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const firebaseConfig = {
      apiKey: "AIzaSyBNSpp5jQFiBLCR1f767zZVucZzVzi4kCA",
      authDomain: "chaiwala-40576.firebaseapp.com",
      databaseURL: "https://chaiwala-40576-default-rtdb.firebaseio.com",
      projectId: "chaiwala-40576",
      storageBucket: "chaiwala-40576.firebasestorage.app",
      messagingSenderId: "85697817373",
      appId: "1:85697817373:web:c8e123eaef5435649c0ff4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const videoContainer = document.getElementById("videoContainer");
    const taskModal = document.getElementById("taskModal");
    const mVideoTitle = document.getElementById("mVideoTitle");
    const taskCounterText = document.getElementById("taskCounterText");
    const taskPercentText = document.getElementById("taskPercentText");
    const watchAdBtn = document.getElementById("watchAdBtn");
    const downloadBtn = document.getElementById("downloadBtn");

    let currentVideoId = null;
    let activeVideo = null;
    let adsCount = 0;
    const REQUIRED_ADS = 5;
    const EXPIRY_TIME_MS = 5 * 60 * 1000;

    // Fake Views Generator (500 se 1000 ke beech, consistent per video)
    function generateConsistentFakeViews(id) {
      let hash = 0;
      for (let i = 0; i < id.length; i++) {
        hash = (hash * 31 + id.charCodeAt(i)) % 1000000;
      }
      return 500 + (Math.abs(hash) % 501); // 500 se 1000
    }

    // Telegram CloudStorage Wrapper
    function getStoredData(key) {
      return new Promise((resolve) => {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage) {
          window.Telegram.WebApp.CloudStorage.getItem(key, (err, value) => {
            if (!err && value) {
              resolve(value);
            } else {
              resolve(localStorage.getItem(key));
            }
          });
        } else {
          resolve(localStorage.getItem(key));
        }
      });
    }

    function setStoredData(key, value) {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage) {
        window.Telegram.WebApp.CloudStorage.setItem(key, value);
      }
      localStorage.setItem(key, value);
    }

    function removeStoredData(key) {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage) {
        window.Telegram.WebApp.CloudStorage.removeItem(key);
      }
      localStorage.removeItem(key);
    }

    // Load Videos & Render Cards
    db.ref("videos").on("value", (snapshot) => {
      const data = snapshot.val();
      videoContainer.innerHTML = "";

      if (!data) {
        videoContainer.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--muted);">Abhi koi video uploaded nahi hai.</div>`;
        return;
      }

      Object.entries(data).reverse().forEach(([id, vid]) => {
        const card = document.createElement("div");
        card.className = "video-card";

        const thumb = vid.thumbnailUrl || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600';
        const fakeViews = generateConsistentFakeViews(id);

        card.innerHTML = `
          <div class="thumb-wrap" onclick="openTaskModal('${id}')">
            <img src="${thumb}" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600'" loading="lazy" />
            <div class="badge-views">👁️ ${fakeViews} Views</div>
            <div class="badge-lock">🔒 5 Ads Task</div>
            <div class="play-btn-circle">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
            </div>
          </div>
          <div class="card-body">
            <div class="card-title" title="${vid.title}">${vid.title}</div>
            <button class="btn-card-action" onclick="openTaskModal('${id}')">
              🎬 Watch 5 Ads & Download
            </button>
          </div>
        `;
        videoContainer.appendChild(card);
      });

      window.allVideosCache = data;
    });

    async function getSavedAdProgress(vidId) {
      const key = `chw_${vidId.slice(-10)}`;
      const record = await getStoredData(key);
      if (!record) return 0;

      try {
        const parsed = JSON.parse(record);
        if (Date.now() - parsed.time > EXPIRY_TIME_MS) {
          removeStoredData(key);
          return 0;
        }
        return parsed.count || 0;
      } catch (e) {
        return 0;
      }
    }

    function saveAdProgress(vidId, count) {
      const key = `chw_${vidId.slice(-10)}`;
      const payload = JSON.stringify({
        count: count,
        time: Date.now()
      });
      setStoredData(key, payload);
    }

    window.openTaskModal = async function(id) {
      currentVideoId = id;
      activeVideo = window.allVideosCache[id];
      if (!activeVideo) return;

      mVideoTitle.innerText = activeVideo.title;

      adsCount = await getSavedAdProgress(id);

      updateStepUI();

      if (adsCount >= REQUIRED_ADS) {
        watchAdBtn.style.display = "none";
        downloadBtn.href = activeVideo.videoUrl;
        downloadBtn.style.display = "block";
      } else {
        downloadBtn.style.display = "none";
        watchAdBtn.style.display = "flex";
        watchAdBtn.disabled = false;
        watchAdBtn.innerText = `▶ Watch Video Ad (${adsCount + 1}/${REQUIRED_ADS})`;
      }

      taskModal.style.display = "flex";
    };

    window.closeModal = function() {
      taskModal.style.display = "none";
    };

    function updateStepUI() {
      for (let i = 1; i <= 5; i++) {
        const pill = document.getElementById(`step-${i}`);
        if (i <= adsCount) {
          pill.classList.add("active");
        } else {
          pill.classList.remove("active");
        }
      }

      const percent = Math.round((adsCount / REQUIRED_ADS) * 100);
      taskCounterText.innerText = `Ads Watched: ${adsCount} / ${REQUIRED_ADS}`;
      taskPercentText.innerText = `${percent}%`;

      if (adsCount < REQUIRED_ADS) {
        watchAdBtn.innerText = `▶ Watch Video Ad (${adsCount + 1}/${REQUIRED_ADS})`;
      }
    }

    window.watchMonetagAd = function() {
      watchAdBtn.disabled = true;
      watchAdBtn.innerText = "Video Ad Loading...";

      if (typeof show_11895299 === 'function') {
        show_11895299()
          .then(() => {
            onRealAdFinished();
          })
          .catch((err) => {
            console.error("Ad closed early:", err);
            alert("Ad poora nahi dekha gaya! Kripya poora ad dekhein.");
            watchAdBtn.disabled = false;
            watchAdBtn.innerText = `▶ Watch Video Ad (${adsCount + 1}/${REQUIRED_ADS})`;
          });
      } else {
        alert("Ad load ho raha hai, kripya 1-2 second ruk kar dobara dabayein!");
        watchAdBtn.disabled = false;
        watchAdBtn.innerText = `▶ Watch Video Ad (${adsCount + 1}/${REQUIRED_ADS})`;
      }
    };

    function onRealAdFinished() {
      adsCount++;
      saveAdProgress(currentVideoId, adsCount);
      updateStepUI();
      watchAdBtn.disabled = false;

      if (adsCount >= REQUIRED_ADS) {
        watchAdBtn.style.display = "none";
        downloadBtn.href = activeVideo.videoUrl;
        downloadBtn.style.display = "block";
      }
    }

    // Real Download Click Tracker
    window.onDownloadClicked = function() {
      if (!currentVideoId) return;
      db.ref(`videos/${currentVideoId}/downloadsCount`).transaction((current) => {
        return (current || 0) + 1;
      });
    };
  </script>
</body>
</html>
